version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: school-mysql
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: school_lost_found
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - school-network

  redis:
    image: redis:7-alpine
    container_name: school-redis
    restart: always
    ports:
      - "6380:6379"
    command: redis-server --requirepass redis123456
    volumes:
      - redis-data:/data
    networks:
      - school-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: school-backend
    restart: always
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: school_lost_found
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123456
    depends_on:
      - mysql
      - redis
    networks:
      - school-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: school-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - school-network

volumes:
  mysql-data:
  redis-data:

networks:
  school-network:
    driver: bridge
